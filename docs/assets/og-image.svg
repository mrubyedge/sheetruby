<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">sheetruby — Ruby, in your sheet</title>
  <desc id="description">Social preview for sheetruby, which runs Ruby code in Google Sheets using mruby/edge and WebAssembly.</desc>

  <defs>
    <radialGradient id="green-glow" cx="100%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#d7eee3"/>
      <stop offset="100%" stop-color="#f8f5f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ruby-glow" cx="0%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#f3d7d7"/>
      <stop offset="100%" stop-color="#f8f5f0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="sheet-clip">
      <rect x="710" y="98" width="418" height="424" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f8f5f0"/>
  <rect width="1200" height="630" fill="url(#green-glow)"/>
  <rect width="1200" height="630" fill="url(#ruby-glow)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="79" y="58" width="60" height="60" rx="16" fill="#0e5b3e"/>
    <path d="M88 51h28a16 16 0 0 1 16 16v28a16 16 0 0 1-16 16H78a6 6 0 0 1-6-6V67a16 16 0 0 1 16-16Z" fill="#dc2b3a"/>
    <path d="M24 17h5l-3 30h-5l3-30Zm14 0h5l-3 30h-5l3-30ZM17 27h30v5H17zM15 39h30v5H15z" transform="translate(73.5 51) scale(0.9375)" fill="#fff"/>
    <text x="148" y="91" fill="#17141f" font-size="30" font-weight="800" letter-spacing="-1">sheetruby</text>

    <text x="72" y="178" fill="#0e5b3e" font-size="16" font-weight="800" letter-spacing="3">GOOGLE SHEETS · RUBY · WEBASSEMBLY</text>
    <text x="68" y="292" fill="#17141f" font-size="94" font-weight="750" letter-spacing="-6">Ruby,</text>
    <text x="68" y="384" fill="#dc2b3a" font-size="76" font-weight="750" letter-spacing="-5">in your sheet.</text>

    <text x="72" y="453" fill="#4d4854" font-size="23">Run Ruby code in Google Sheets with</text>
    <text x="72" y="487" fill="#4d4854" font-size="23"><tspan fill="#17141f" font-weight="700">mruby/edge</tspan><tspan> and WebAssembly.</tspan></text>
    <text x="72" y="570" fill="#17141f" font-size="21" font-weight="750">mrubyedge.github.io/sheetruby</text>

    <rect x="724" y="112" width="418" height="424" rx="18" fill="#16815a"/>
    <g transform="rotate(1 919 310)">
      <rect x="704" y="92" width="418" height="424" rx="18" fill="#fffdf9" stroke="#17141f" stroke-width="3"/>
      <g clip-path="url(#sheet-clip)">
        <rect x="704" y="92" width="418" height="62" fill="#0e5b3e"/>
        <circle cx="733" cy="123" r="6" fill="#ff8b83"/>
        <circle cx="754" cy="123" r="6" fill="#8fc3aa"/>
        <circle cx="775" cy="123" r="6" fill="#8fc3aa"/>
        <text x="797" y="130" fill="#fff" font-size="15" font-weight="750">Ruby playground</text>

        <rect x="704" y="154" width="418" height="62" fill="#fff"/>
        <line x1="704" y1="216" x2="1122" y2="216" stroke="#c9d9d1"/>
        <line x1="754" y1="154" x2="754" y2="216" stroke="#c9d9d1"/>
        <text x="722" y="192" fill="#0e5b3e" font-family="Georgia, serif" font-size="22" font-style="italic" font-weight="700">fx</text>
        <text x="770" y="192" fill="#343039" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">=EVAL_RUBY_SCRIPT("$arg1 * 2", A2)</text>

        <rect x="704" y="216" width="418" height="39" fill="#f2f7f4"/>
        <line x1="704" y1="255" x2="1122" y2="255" stroke="#c9d9d1"/>
        <line x1="754" y1="216" x2="754" y2="516" stroke="#c9d9d1"/>
        <line x1="876" y1="216" x2="876" y2="516" stroke="#c9d9d1"/>
        <line x1="1000" y1="216" x2="1000" y2="516" stroke="#c9d9d1"/>
        <text x="810" y="241" fill="#65746d" font-size="12" font-weight="700">A</text>
        <text x="934" y="241" fill="#65746d" font-size="12" font-weight="700">B</text>
        <text x="1056" y="241" fill="#65746d" font-size="12" font-weight="700">C</text>

        <g fill="#65746d" font-size="11" font-weight="700" text-anchor="middle">
          <text x="729" y="290">1</text>
          <text x="729" y="352">2</text>
          <text x="729" y="414">3</text>
          <text x="729" y="476">4</text>
        </g>
        <g stroke="#c9d9d1">
          <line x1="704" y1="317" x2="1122" y2="317"/>
          <line x1="704" y1="379" x2="1122" y2="379"/>
          <line x1="704" y1="441" x2="1122" y2="441"/>
          <line x1="704" y1="503" x2="1122" y2="503"/>
        </g>

        <rect x="999" y="318" width="123" height="61" fill="#f4fbf7" fill-opacity="0.72" stroke="#16815a" stroke-width="3"/>
        <g fill="#343039" font-size="13">
          <text x="772" y="290">input</text>
          <text x="894" y="290">Ruby</text>
          <text x="1018" y="290">result</text>
          <text x="772" y="352">21</text>
          <text x="1018" y="352" fill="#0e5b3e" font-weight="800">42</text>
          <text x="772" y="414">16</text>
          <text x="1018" y="414">4</text>
          <text x="772" y="476">hello</text>
          <text x="1018" y="476">HELLO</text>
        </g>
        <g fill="#9e1625" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
          <text x="894" y="352">$arg1 * 2</text>
          <text x="888" y="414">Math.sqrt($arg1)</text>
          <text x="894" y="476">$arg1.upcase</text>
        </g>
      </g>
    </g>
  </g>
</svg>
